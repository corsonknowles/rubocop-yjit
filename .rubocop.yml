inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-internal_affairs
  - rubocop-performance

AllCops:
  Exclude:
    - vendor/**/*
    # Bundler-generated binstubs; regenerating them would revert any autocorrection.
    - bin/rspec
    - bin/rubocop
  NewCops: disable
  SuggestExtensions: false

InternalAffairs:
  Enabled: true

Naming/FileName:
  Exclude:
  - lib/rubocop-yjit.rb

Layout/LineLength:
  AllowCopDirectives: true

InternalAffairs/UndefinedConfig:
  Enabled: false # Bug in implementation fails to find our configs

Style/StringLiterals:
  EnforcedStyle: double_quotes

Metrics/MethodLength:
  Max: 20

Style/StringConcatenation:
  Enabled: false

Style/SlicingWithRange:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '**/*.rake'

Style/FormatStringToken:
  Enabled: false # this Cop is marked safe autocorrect but it is not
